shared:
    environment:
        NODE_PACKAGE_VERSION_EXPRESSION: ""
    image: golang:latest
    steps:
        -   print: echo this is shared-steps test test-habitat-pkg-download-tilde job
        -   sd_step: sd-step exec core/node "node -v"
        -   sd_step_tilde: sd-step exec --pkg-version $NODE_PACKAGE_VERSION_EXPRESSION core/node "node -v"
    requires:
        - ~pr
        - ~commit
jobs:
    main:
        steps:
            - print: echo this is shared-steps test main job
            - sd_step: sd-step exec core/node "node -v"
