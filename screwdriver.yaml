            - sd_step_specify: sd-step exec --pkg-version "14.18.1" core/node "node -v"
    test-habitat-pkg-download-tilde:
        environment:
            NODE_PACKAGE_VERSION_EXPRESSION: "~14.18.1"
    test-habitat-pkg-download-hat:
